{% extends "base.html" %}
{% block title %}{{ code }} – Expense Tracker{% endblock %}
{% block content %}
<div class="panel narrow error-hero">
  <div class="code">{{ code }}</div>
  <h2>{{ message }}</h2>
  <p class="hint">Let's get you back on track.</p>
  <div class="row" style="margin-top:16px">
    <a class="btn primary" href="{{ url_for('index') }}" style="flex:1">Go home</a>
    <a class="btn ghost" href="{{ url_for('transactions') }}">Transactions</a>
  </div>
</div>
{% endblock %}
