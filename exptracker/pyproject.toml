[tool.black]
line-length = 100
target-version = ["py314"]
include = "expense_tracker\\.py|seed_dummy\\.py"

[tool.pycodestyle]
max-line-length = 100
ignore = ["E203", "W503"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = ["__pycache__", ".git", ".venv", "venv", "build", "dist"]
